<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nova UI 编辑器</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #f7f5fb;
        color: #2a2438;
        font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
        z-index: 9999;
      }
      #boot-error {
        max-width: 820px;
        margin: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #fff0f0;
        color: #8b1e1e;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div style="font-size: 22px; font-weight: 600">Nova UI 编辑器</div>
      <div>正在加载界面…</div>
      <div id="boot-error"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var box = document.getElementById("boot-error");
        if (box) box.textContent += "\n[error] " + (event.message || "?") + " @" + (event.filename || "") + ":" + (event.lineno || 0);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var box = document.getElementById("boot-error");
        if (box) box.textContent += "\n[promise] " + String(event.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
