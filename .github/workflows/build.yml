name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    name: Web build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: C++ FFI sample contract
        run: npm run check:cpp-ffi

      - name: Build C++ FFI sample
        run: |
          cmake -S examples/cpp-ffi -B examples/cpp-ffi/build
          cmake --build examples/cpp-ffi/build --config Release

  build-windows-exe:
    name: Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri exe
        run: npm run tauri:exe

      - name: Smoke the exe
        run: npm run check:desktop-exe

      # The Windows exe is the artifact people actually double-click. Building
      # it is not the same as proving it opens, so start it and require it to
      # still be running once the WebView has had time to come up.
      - name: Launch the exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/nova-ui-kit.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Write-Host "launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) {
            Write-Host "the exe exited during startup"
            exit 1
          }
          Write-Host "nova-ui-kit still running after 15s (pid $($proc.Id))"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Rust unit tests (windows)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-windows-exe
          path: src-tauri/target/release/nova-ui-kit.exe

  # P2-12: Linux/macOS bundles. These stay off the push/PR critical path so a
  # queueing macOS runner cannot block the main gate, but are one click away via
  # workflow_dispatch. Tagged releases always build them (see release.yml).
  linux-bundle:
    name: Linux bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check:platform-bundle
      - run: npm run tauri:build
      - name: Verify and stage Linux bundles
        run: |
          node scripts/verify-release-artifacts.mjs --dir src-tauri/target/release/bundle --platform linux
          mkdir -p artifacts/linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/linux/
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/linux/
          cp src-tauri/target/release/bundle/SHA256SUMS.txt artifacts/linux/
      - name: Install the .deb and launch it
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo dpkg -i artifacts/linux/*.deb || sudo apt-get install -f -y -qq
          BIN="$(command -v nova-ui-kit)"
          echo "installed binary: $BIN"
          file "$BIN"
          ldd "$BIN" | tee /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "the installed binary has unresolved shared libraries"
            exit 1
          fi
          chmod +x artifacts/linux/*.AppImage
          file artifacts/linux/*.AppImage
          echo "--- launch under a virtual display ---"
          xvfb-run -a "$BIN" > /tmp/nova-launch.log 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "the app exited during startup"
            cat /tmp/nova-launch.log
            exit 1
          fi
          echo "nova-ui-kit still running after 10s (pid $APP_PID)"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-linux-bundles
          if-no-files-found: error
          path: artifacts/linux/

  macos-bundle:
    name: macOS bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:platform-bundle
      - run: npm run tauri:build
      - name: Verify and stage macOS bundle
        run: |
          node scripts/verify-release-artifacts.mjs --dir src-tauri/target/release/bundle --platform macos
          mkdir -p artifacts/macos
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/macos/
          cp -R src-tauri/target/release/bundle/macos/*.app artifacts/macos/
          cp src-tauri/target/release/bundle/SHA256SUMS.txt artifacts/macos/
      - name: Mount the dmg and launch the app
        run: |
          set -e
          DMG=(artifacts/macos/*.dmg)
          echo "dmg: ${DMG[0]}"
          MOUNT="$(hdiutil attach "${DMG[0]}" -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')"
          echo "mounted at: $MOUNT"
          APP="$(find "$MOUNT" -maxdepth 2 -name '*.app' | head -1)"
          echo "app bundle: $APP"
          test -n "$APP"
          test -f "$APP/Contents/Info.plist"
          BIN_NAME="$(defaults read "$APP/Contents/Info.plist" CFBundleExecutable)"
          BIN="$APP/Contents/MacOS/$BIN_NAME"
          echo "executable: $BIN"
          test -x "$BIN"
          file "$BIN"
          otool -L "$BIN" | head -25
          if otool -L "$BIN" | grep -q "not found"; then
            echo "the app binary has unresolved dylibs"
            exit 1
          fi
          echo "--- launch ---"
          "$BIN" > /tmp/nova-launch.log 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "the app exited during startup"
            cat /tmp/nova-launch.log
            hdiutil detach "$MOUNT" -quiet
            exit 1
          fi
          echo "Nova UI Editor still running after 10s (pid $APP_PID)"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          hdiutil detach "$MOUNT" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-macos-bundle
          if-no-files-found: error
          path: artifacts/macos/
