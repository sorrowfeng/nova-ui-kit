name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    name: Web build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: C++ FFI sample contract
        run: npm run check:cpp-ffi

      - name: Build C++ FFI sample
        run: |
          cmake -S examples/cpp-ffi -B examples/cpp-ffi/build
          cmake --build examples/cpp-ffi/build --config Release

  build-windows-exe:
    name: Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri exe
        run: npm run tauri:exe

      - name: Rust unit tests (windows)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-windows-exe
          path: src-tauri/target/release/nova-ui-kit.exe

