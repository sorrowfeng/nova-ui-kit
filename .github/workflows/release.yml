name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check manifests agree with the tag
        run: node scripts/check-version-consistency.mjs "${{ steps.tag.outputs.version }}"

      - name: Require a CHANGELOG entry for this version
        run: |
          if ! grep -q "^## ${{ steps.tag.outputs.version }} —" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${{ steps.tag.outputs.version }}."
            echo "Run: npm run version:set ${{ steps.tag.outputs.version }} && npm run changelog ${{ steps.tag.outputs.version }}"
            exit 1
          fi

      - name: Draft release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.name }}"^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            node scripts/generate-release-notes.mjs --since-tag "$PREV" --out docs/release-notes-draft.md
          else
            node scripts/generate-release-notes.mjs --out docs/release-notes-draft.md
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: docs/release-notes-draft.md

  build-windows:
    name: Windows exe
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri exe
        run: npm run tauri:exe

      - name: Verify Windows exe
        run: |
          mkdir -p artifacts/windows
          cp src-tauri/target/release/nova-ui-kit.exe artifacts/windows/
          node scripts/verify-release-artifacts.mjs --dir artifacts/windows --platform windows

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-windows-exe
          if-no-files-found: error
          path: artifacts/windows/

  build-linux:
    name: Linux bundles
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri:build

      - name: Verify and stage Linux bundles
        run: |
          node scripts/verify-release-artifacts.mjs --dir src-tauri/target/release/bundle --platform linux
          mkdir -p artifacts/linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/linux/
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/linux/
          cp src-tauri/target/release/bundle/SHA256SUMS.txt artifacts/linux/

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-linux-bundles
          if-no-files-found: error
          path: artifacts/linux/

  build-macos:
    name: macOS bundle
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri:build

      - name: Verify and stage macOS bundle
        run: |
          node scripts/verify-release-artifacts.mjs --dir src-tauri/target/release/bundle --platform macos
          mkdir -p artifacts/macos
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/macos/
          cp -R src-tauri/target/release/bundle/macos/*.app artifacts/macos/
          cp src-tauri/target/release/bundle/SHA256SUMS.txt artifacts/macos/

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-kit-macos-bundle
          if-no-files-found: error
          path: artifacts/macos/

  publish:
    name: Publish GitHub Release
    needs: [verify, build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify every platform produced a bundle
        run: |
          fail=0
          require() {
            if ! ls $1 >/dev/null 2>&1; then echo "missing: $1"; fail=1; fi
          }
          require "artifacts/nova-ui-kit-windows-exe/*.exe"
          require "artifacts/nova-ui-kit-windows-exe/SHA256SUMS.txt"
          require "artifacts/nova-ui-kit-linux-bundles/*.AppImage"
          require "artifacts/nova-ui-kit-linux-bundles/*.deb"
          require "artifacts/nova-ui-kit-linux-bundles/SHA256SUMS.txt"
          require "artifacts/nova-ui-kit-macos-bundle/*.dmg"
          require "artifacts/nova-ui-kit-macos-bundle/*.app"
          require "artifacts/nova-ui-kit-macos-bundle/SHA256SUMS.txt"
          require "artifacts/release-notes/release-notes-draft.md"
          echo "--- checksums ---"
          find artifacts -name SHA256SUMS.txt -exec echo {} \; -exec cat {} \;
          exit $fail

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: artifacts/release-notes/release-notes-draft.md
          files: |
            artifacts/nova-ui-kit-windows-exe/*.exe
            artifacts/nova-ui-kit-windows-exe/SHA256SUMS.txt
            artifacts/nova-ui-kit-linux-bundles/*.AppImage
            artifacts/nova-ui-kit-linux-bundles/*.deb
            artifacts/nova-ui-kit-linux-bundles/SHA256SUMS.txt
            artifacts/nova-ui-kit-macos-bundle/*.dmg
            artifacts/nova-ui-kit-macos-bundle/SHA256SUMS.txt
          fail_on_unmatched_files: true
